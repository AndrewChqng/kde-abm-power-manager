# /etc/tmpfiles.d/kde-abm-power-manager.conf
# Grants members of the 'wheel' group write access to root cgroup v2 reclaim
# and THP / module parameters at boot.

z /sys/fs/cgroup/memory.reclaim                      0220 root wheel -
z /sys/kernel/mm/transparent_hugepage/enabled        0664 root wheel -
z /sys/kernel/mm/transparent_hugepage/defrag         0664 root wheel -
z /sys/module/pcie_aspm/parameters/policy            0664 root wheel -
z /sys/module/snd_hda_intel/parameters/power_save    0664 root wheel -
z /sys/firmware/acpi/platform_profile                0664 root wheel -
