name: Validate shell scripts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck

      - name: Check Bash syntax
        run: |
          bash -n additional-power-management-tweaks.sh
          bash -n install-permissions.sh

      - name: Run ShellCheck
        run: shellcheck --severity=error additional-power-management-tweaks.sh install-permissions.sh
